# Free Supabase projects pause after a week with no activity.
# This pings the database every 3 days so Kane Books never goes to sleep.
name: Keep database awake

on:
  schedule:
    - cron: "17 14 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call keepalive()
        run: |
          curl --fail --silent --show-error -X POST \
            "https://moszaslmoudygmxygzcf.supabase.co/rest/v1/rpc/keepalive" \
            -H "apikey: sb_publishable_XCh0o98NCD0J7_fSRrTuzg_EC1Opcii" \
            -H "Content-Type: application/json" -d '{}'
